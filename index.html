<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マッチ4パズルゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <!-- 左カラム：ハイスコア／ミッション／マスコット -->
        <div id="left-column">
            <aside id="highscores-panel" aria-label="highscores"></aside>

            <div id="mission-panel">
                <div class="mission-title">MISSION</div>
                <div class="mission-icons" aria-hidden="true">
                    <img class="mission-gem" src="img/pink.png" alt="">
                    <img class="mission-gem" src="img/pink.png" alt="">
                    <img class="mission-gem" src="img/pink.png" alt="">
                </div>
                <div class="mission-text">同じ色を<br>3つ以上つなげよう！</div>
            </div>

            <div id="mascot" aria-hidden="true">
                <img src="img/mascot.png" alt="" width="150">
            </div>
        </div>

        <!-- 中央カラム：ゲーム盤＋モード切替ボタン -->
        <div id="center-column">
            <div id="game-container"></div>
            <!-- スマホ表示時のみ、プレイ画面の下に横向きのフィーバーゲージを表示する枠 -->
            <div id="mobile-gauge-container"></div>

            <!-- モード切替ボタン（盤面の下・カード内） -->
            <div class="tab-bar" id="mode-tabs">
                <button id="tab-timemode" class="tab tab-time" aria-label="タイムモード"></button>
                <button id="tab-turnmode" class="tab tab-turn" aria-label="ターンモード"></button>
                <button id="tab-freeplay" class="tab tab-free active" aria-label="フリープレイ"></button>
            </div>
        </div>

        <div id="ui-container"></div>
    </div>

    <!-- オープニング画面（起動時に表示し、モードを選ぶとゲーム開始） -->
    <div id="opening-screen" class="opening-overlay">
        <div class="opening-box">
            <img class="opening-mascot" src="img/mascot.png" alt="">
            <h1 class="opening-title">MATCH 4<br><span>PUZZLE</span></h1>
            <p class="opening-sub">SELECT MODE</p>
            <div class="opening-modes">
                <div class="opening-mode">
                    <button class="tab tab-time opening-btn" data-mode="timemode" aria-label="タイムモード"></button>
                    <p class="opening-desc" id="opening-desc-time">時間内にハイスコアを目指そう</p>
                </div>
                <div class="opening-mode">
                    <button class="tab tab-turn opening-btn" data-mode="turnmode" aria-label="ターンモード"></button>
                    <p class="opening-desc" id="opening-desc-turn">限られた手数でハイスコアを目指そう</p>
                </div>
                <div class="opening-mode">
                    <button class="tab tab-free opening-btn" data-mode="freeplay" aria-label="フリープレイ"></button>
                    <p class="opening-desc">時間も手数も無制限でのんびり遊ぼう</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ハイスコア登録時の名前入力モーダル -->
    <div id="name-input-modal" class="modal-overlay" hidden>
        <div class="modal-box">
            <p id="name-input-message" class="modal-message"></p>
            <input type="text" id="name-input-field" class="modal-input" maxlength="20" autocomplete="off">
            <div class="modal-buttons">
                <button id="name-input-cancel" class="modal-btn modal-btn-cancel">キャンセル</button>
                <button id="name-input-ok" class="modal-btn modal-btn-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- ゲームロジックファイル -->
    <script src="Piece.js"></script>
    <script src="Grid.js"></script>
    <script src="GameLogic.js"></script>
    <script src="Input.js"></script>
    <script src="MatchDetector.js"></script>
    <script src="AnimationManager.js"></script>
    <script src="ScoringSystem.js"></script>
    <script src="HighscoreAPI.js"></script>
    <script src="Sound.js"></script>
    <script src="GameState.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
